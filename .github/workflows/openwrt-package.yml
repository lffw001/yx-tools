name: Build OpenWrt Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '3.0.0'

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - arm_cortex-a7-neon
          - arm_cortex-a9-vfpv3
          - mips_24kc
          - mipsel_24kc
          - x86_64
        include:
          - arch: aarch64_generic
            binary: arm64
          - arch: arm_cortex-a7-neon
            binary: arm_7
          - arch: arm_cortex-a9-vfpv3
            binary: arm_8
          - arch: mips_24kc
            binary: mips
          - arch: mipsel_24kc
            binary: mipsel
          - arch: x86_64
            binary: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Download binary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BINARY=${{ matrix.binary }}
          ARCH=${{ matrix.arch }}
          
          echo "Downloading binary for $ARCH ($BINARY) version $VERSION"
          
          # 尝试多种格式下载
          curl -L --max-time 60 "https://github.com/byJoey/yx-tools/releases/download/v${VERSION}/yx_linux_${BINARY}.tar.gz" -o yx.tar.gz 2>/dev/null && {
            tar -xzf yx.tar.gz
            rm yx.tar.gz
          } || \
          curl -L --max-time 60 "https://github.com/byJoey/yx-tools/releases/download/v${VERSION}/yx_linux_${BINARY}.zip" -o yx.zip 2>/dev/null && {
            unzip -o yx.zip
            rm yx.zip
          } || \
          curl -L --max-time 60 "https://github.com/byJoey/yx-tools/releases/download/v${VERSION}/yx-linux-${BINARY}" -o yx 2>/dev/null || \
          curl -L --max-time 60 "https://github.com/byJoey/yx-tools/releases/download/v${VERSION}/yx_linux_${BINARY}.exe" -o yx.exe 2>/dev/null && {
            mv yx.exe yx
          } || {
            curl -L --max-time 60 "https://github.com/byJoey/yx-tools/releases/download/v${VERSION}/yx_linux_${BINARY}"
