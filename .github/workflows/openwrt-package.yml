name: Build OpenWrt Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '3.0.0'

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - arm_cortex-a7-neon
          - arm_cortex-a9-vfpv3
          - mips_24kc
          - mipsel_24kc
          - x86_64
        include:
          - arch: aarch64_generic
            goos: linux
            goarch: arm64
            goarm: ""
          - arch: arm_cortex-a7-neon
            goos: linux
            goarch: arm
            goarm: "7"
          - arch: arm_cortex-a9-vfpv3
            goos: linux
            goarch: arm
            goarm: "8"
          - arch: mips_24kc
            goos: linux
            goarch: mips
            goarm: ""
          - arch: mipsel_24kc
            goos: linux
            goarch: mipsle
            goarm: ""
          - arch: x86_64
            goos: linux
            goarch: amd64
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Build binary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          GOOS=${{ matrix.goos }}
          GOARCH=${{ matrix.goarch }}
          GOARM=${{ matrix.goarm }}
          ARCH=${{ matrix.arch }}
          
          echo "Building binary for $ARCH (GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM)"
          
          # 设置编译参数
          export CGO_ENABLED=0
          export GOOS=$GOOS
          export GOARCH=$GOARCH
          if [ -n "$GOARM" ]; then
            export GOARM=$GOARM
          fi
          
          # 编译
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o yx ./cmd/yx
          
          # 验证
          chmod +x yx
          ./yx version || true
          echo "Binary built successfully:"
          ls -la yx

      - name: Setup package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARCH=${{ matrix.arch }}
          
          echo "Setting up OpenWrt package for $ARCH version $VERSION"
          
          # 创建目录结构
          mkdir -p package/yx-tools/files/www
          mkdir -p package/yx-tools/files/etc/init.d
          mkdir -p package/yx-tools/files/etc/config
          
          # 复制二进制文件
          cp yx package/yx-tools/files/yx
          chmod 755 package/yx-tools/files/yx
          
          # 复制 web 界面文件
          if [ -d "internal/app/web" ]; then
            cp -r internal/app/web/* package/yx-tools/files/www/
          fi
          
          # 创建 init 脚本
          cat > package/yx-tools/files/etc/init.d/yx-tools << 'INITEOF'
          #!/bin/sh /etc/rc.common
          # Copyright (C) 2024 byJoey
          # Cloudflare优选IP测速工具 OpenWrt 服务脚本

          START=85
          STOP=15

          START_MODE="web"
          START_ARGS=""

          get_config() {
              uci -q get "yx-tools.$1.$2" 2>/dev/null
          }

          start_service() {
              START_MODE=$(get_config global start_mode)
              [ -z "$START_MODE" ] && START_MODE="web"
              
              START_ARGS=$(get_config global start_args)
              
              case "$START_MODE" in
                  web)
                      local listen_addr
                      listen_addr=$(get_config global listen_addr)
                      [ -z "$listen_addr" ] && listen_addr="0.0.0.0:8080"
                      
                      procd_open_instance
                      procd_set_param command /usr/bin/yx web -listen "$listen_addr" -no-open $START_ARGS
                      procd_set_param respawn 1000 10 3
                      procd_set_param env YX_DATA_DIR=/root/.yx-tools
                      procd_set_param file /etc/config/yx-tools
                      procd_close_instance
                      ;;
                  test)
                      procd_open_instance
                      procd_set_param command /usr/bin/yx test $START_ARGS
                      procd_set_param respawn 0
                      procd_set_param env YX_DATA_DIR=/root/.yx-tools
                      procd_set_param file /etc/config/yx-tools
                      procd_close_instance
                      ;;
                  *)
                      logger -t yx-tools "Unknown start mode: $START_MODE"
                      return 1
                      ;;
              esac
          }

          stop_service() {
              killall yx 2>/dev/null || true
          }

          reload_service() {
              stop
              start
          }
          INITEOF
          chmod 755 package/yx-tools/files/etc/init.d/yx-tools
          
          # 创建配置文件
          cat > package/yx-tools/files/etc/config/yx-tools << 'CONFEOF'
          config global 'global'
              # 启动模式: web(网页界面) 或 test(命令行测速)
              option start_mode 'web'
              # Web界面监听地址 (仅web模式有效)
              option listen_addr '0.0.0.0:8080'
              # 额外的启动参数
              option start_args ''
          CONFEOF
          chmod 644 package/yx-tools/files/etc/config/yx-tools
          
          # 创建 Makefile
          cat > package/yx-tools/Makefile << MAKEEOF
          # SPDX-License-Identifier: GPL-2.0-only
          #
          # Copyright (C) 2024 byJoey
          #
          
          include \$(TOPDIR)/rules.mk
          
          PKG_NAME:=yx-tools
          PKG_VERSION:=${VERSION}
          PKG_RELEASE:=1
          
          PKG_MAINTAINER:=byJoey <https://github.com/byJoey>
          PKG_LICENSE:=MIT
          PKG_LICENSE_FILES:=LICENSE
          
          include \$(INCLUDE_DIR)/package.mk
          
          define Package/yx-tools
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=Web Servers/Proxies
            TITLE:=Cloudflare优选IP测速工具
            URL:=https://github.com/byJoey/yx-tools
            DEPENDS:=+curl
          endef
          
          define Package/yx-tools/description
           Cloudflare优选IP测速工具，支持CLI和Web界面，
           可测速Cloudflare各数据中心延迟和下载速度，
           支持一键上报到cfnew面板或GitHub。
          endef
          
          define Package/yx-tools/conffiles
          /etc/config/yx-tools
          endef
          
          define Build/Prepare
          true
          endef
          
          define Build/Configure
          true
          endef
          
          define Build/Compile
          true
          endef
          
          define Package/yx-tools/install
          \$(INSTALL_DIR) \$(1)/usr/bin
          \$(INSTALL_BIN) \$(PKG_BUILD_DIR)/yx \$(1)/usr/bin/yx
          \$(INSTALL_DIR) \$(1)/etc/init.d
          \$(INSTALL_BIN) ./files/etc/init.d/yx-tools \$(1)/etc/init.d/yx-tools
          \$(INSTALL_DIR) \$(1)/etc/config
          \$(INSTALL_CONF) ./files/etc/config/yx-tools \$(1)/etc/config/yx-tools
          \$(INSTALL_DIR) \$(1)/usr/share/yx-tools
          \$(CP) ./files/www/* \$(1)/usr/share/yx-tools/
          \$(INSTALL_DIR) \$(1)/www
          \$(LN) yx-tools \$(1)/www/yx-tools
          endef
          
          \$(eval \$(call BuildPackage,yx-tools))
          MAKEEOF

      - name: Build ipk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARCH=${{ matrix.arch }}
          
          echo "Building ipk package for $ARCH"
          
          # 创建临时构建目录
          BUILD_DIR=$(mktemp -d)
          PKG_NAME="yx-tools_${VERSION}_openwrt_${ARCH}.ipk"
          
          # 创建 ipk 结构
          CONTROL_DIR="$BUILD_DIR/control"
          DATA_DIR="$BUILD_DIR/data"
          mkdir -p "$CONTROL_DIR" "$DATA_DIR"
          
          # 创建 control 文件
          cat > "$CONTROL_DIR/control" << EOF
          Package: yx-tools
          Version: ${VERSION}-1
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Depends: curl
          Maintainer: byJoey <https://github.com/byJoey>
          Source: https://github.com/byJoey/yx-tools
          License: MIT
          LicenseFiles: LICENSE
          Category: Network
          Title: Cloudflare优选IP测速工具
          Description: Cloudflare优选IP测速工具，支持CLI和Web界面。
          EOF
          
          # 复制文件到 data 目录
          mkdir -p "$DATA_DIR/usr/bin"
          mkdir -p "$DATA_DIR/etc/init.d"
          mkdir -p "$DATA_DIR/etc/config"
          mkdir -p "$DATA_DIR/usr/share/yx-tools"
          
          cp package/yx-tools/files/yx "$DATA_DIR/usr/bin/yx"
          chmod 755 "$DATA_DIR/usr/bin/yx"
          
          cp package/yx-tools/files/etc/init.d/yx-tools "$DATA_DIR/etc/init.d/"
          chmod 755 "$DATA_DIR/etc/init.d/yx-tools"
          
          cp package/yx-tools/files/etc/config/yx-tools "$DATA_DIR/etc/config/"
          chmod 644 "$DATA_DIR/etc/config/yx-tools"
          
          cp -r package/yx-tools/files/www/* "$DATA_DIR/usr/share/yx-tools/"
          
          # 创建 data.tar.gz
          cd "$DATA_DIR"
          tar -czf "$BUILD_DIR/data.tar.gz" .
          cd "$BUILD_DIR"
          
          # 创建 control.tar.gz
          cd "$CONTROL_DIR"
          tar -czf "$BUILD_DIR/control.tar.gz" .
          cd "$BUILD_DIR"
          
          # 创建 ipk (使用 tar 代替 ar)
          echo "2.0" > "$BUILD_DIR/debian-binary"
          cd "$BUILD_DIR"
          # 使用 tar 创建 ipk (ipk 本质就是一个 tar.gz)
          tar -czf "$PKG_NAME" --transform="s,^,./," debian-binary control.tar.gz data.tar.gz
          
          # 移动到 artifacts
          mkdir -p artifacts
          mv "$PKG_NAME" artifacts/
          
          # 清理
          rm -rf "$BUILD_DIR"
          
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          echo "Built: artifacts/$PKG_NAME"
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yx-tools-${{ matrix.arch }}
          path: artifacts/${{ env.PKG_NAME }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Available packages:"
          find artifacts -name "*.ipk" -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.ipk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
